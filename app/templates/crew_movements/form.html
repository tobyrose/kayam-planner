{% extends "base.html" %}{% block title %}New crew move · Kayam Planner{% endblock %}{% block content %}<h1>New crew move</h1><form method="post" class="planning-section admin-form row g-3">
<div class="col-md-6"><label class="form-label">Movement code</label><input class="form-control" name="movement_code" placeholder="CM16" required></div><div class="col-md-6"><label class="form-label">Tentmaster</label><select class="form-select" name="tentmaster_id"><option value="">Not assigned</option>{% for item in tentmasters %}<option value="{{ item.id }}">{{ item.name }}</option>{% endfor %}</select></div>
<div class="col-md-6"><label class="form-label">Origin</label><select class="form-select" name="origin_location_id">{% for item in locations %}<option value="{{ item.id }}">{{ item.name }}</option>{% endfor %}</select></div><div class="col-md-6"><label class="form-label">Destination</label><select class="form-select" name="destination_location_id">{% for item in locations %}<option value="{{ item.id }}">{{ item.name }}</option>{% endfor %}</select></div>
<div class="col-md-6"><label class="form-label">Depart after</label><input class="form-control" type="datetime-local" name="depart_after" required></div><div class="col-md-6"><label class="form-label">Arrive by</label><input class="form-control" type="datetime-local" name="arrive_by" required></div><div class="col-12"><label class="form-label">Van</label><select class="form-select" name="van_id"><option value="">None / other travel</option>{% for item in vans %}<option value="{{ item.id }}">{{ item.registration_or_name }} · {{ item.passenger_capacity }} seats</option>{% endfor %}</select></div><div class="col-12"><button class="btn btn-primary">Create crew move</button></div></form>{% endblock %}
