<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}{{ app_name }}{% endblock %}</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
      rel="stylesheet"
    >
    <link href="{{ url_for('static', path='/css/app.css') }}" rel="stylesheet">
    <script src="https://unpkg.com/htmx.org@2.0.6" defer></script>
  </head>
  <body>
    <a class="visually-hidden-focusable" href="#main-content">Skip to main content</a>
    <nav class="navbar navbar-expand-lg bg-dark" data-bs-theme="dark" aria-label="Primary">
      <div class="container-fluid">
        <a class="navbar-brand" href="/">Kayam Planner</a>
        <ul class="navbar-nav flex-row gap-3">
          <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="/jobs">Jobs</a></li>
          <li class="nav-item"><a class="nav-link" href="/planning">Season board</a></li>
          <li class="nav-item"><a class="nav-link" href="/conflicts">Conflicts</a></li>
          <li class="nav-item"><a class="nav-link" href="/planning/crew">Crew board</a></li>
          <li class="nav-item"><a class="nav-link" href="/equipment">Equipment</a></li>
          <li class="nav-item"><a class="nav-link" href="/loads">Loads</a></li>
          <li class="nav-item"><a class="nav-link" href="/routes">Routes</a></li>
          <li class="nav-item"><a class="nav-link" href="/crew-moves">Crew moves</a></li>
          <li class="nav-item"><a class="nav-link" href="/costs">Costs</a></li>
          <li class="nav-item"><a class="nav-link" href="/system">System</a></li>
          <li class="nav-item"><a class="nav-link" href="/admin">Administration</a></li>
          <li class="nav-item"><a class="nav-link" href="/health">Health</a></li>
        </ul>
      </div>
    </nav>
    <main id="main-content" class="container py-4">
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
