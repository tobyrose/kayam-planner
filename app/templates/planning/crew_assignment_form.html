{% extends "base.html" %}
{% block title %}Assign crew · Kayam Planner{% endblock %}
{% block content %}<h1 class="h2">Assign crew to {{ phase.job.name }} · {{ phase.phase_type.value|replace('_',' ') }}</h1>{% if errors %}<div class="alert alert-danger">{{ errors|join('; ') }}</div>{% endif %}<form method="post" class="form-section"><div class="row g-3"><div class="col-md-5"><label class="form-label" for="crew_member_id">Named crew member</label><select class="form-select" id="crew_member_id" name="crew_member_id"><option value="">— use placeholder —</option>{% for person in crew_members %}<option value="{{ person.id }}">{{ person.name }}</option>{% endfor %}</select></div><div class="col-md-5"><label class="form-label" for="placeholder_name">Placeholder</label><input class="form-control" id="placeholder_name" name="placeholder_name" placeholder="e.g. Local crew 1"></div><div class="col-md-4"><label class="form-label" for="tentmaster_id">Tentmaster</label><select class="form-select" id="tentmaster_id" name="tentmaster_id"><option value="">—</option>{% for team in tentmasters %}<option value="{{ team.id }}" {% if phase.tentmaster_id == team.id %}selected{% endif %}>{{ team.name }}</option>{% endfor %}</select></div><div class="col-md-4"><label class="form-label" for="start_at">Start</label><input class="form-control" type="datetime-local" id="start_at" name="start_at" value="{{ phase.start_at.strftime('%Y-%m-%dT%H:%M') }}" required></div><div class="col-md-4"><label class="form-label" for="end_at">End</label><input class="form-control" type="datetime-local" id="end_at" name="end_at" value="{{ phase.end_at.strftime('%Y-%m-%dT%H:%M') }}" required></div><div class="col-md-4"><label class="form-label" for="role">Role</label><input class="form-control" id="role" name="role" value="Crew"></div><div class="col-md-4"><label class="form-label" for="hourly_cost_override">Hourly cost override</label><input class="form-control" type="number" min="0" step="0.01" id="hourly_cost_override" name="hourly_cost_override"></div><div class="col-md-4 d-flex align-items-end"><div class="form-check mb-2"><input class="form-check-input" type="checkbox" id="locked" name="locked"><label class="form-check-label" for="locked">Lock assignment</label></div></div></div><div class="mt-3"><button class="btn btn-primary" type="submit">Assign</button> <a class="btn btn-outline-secondary" href="/jobs/{{ phase.job_id }}">Cancel</a></div></form>{% endblock %}
