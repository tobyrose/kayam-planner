{% extends "base.html" %}
{% block title %}Add crew activity · Kayam Planner{% endblock %}
{% block content %}<h1 class="h2">Add crew activity</h1><form method="post" class="form-section"><div class="row g-3"><div class="col-md-4"><label class="form-label" for="activity_type">Type</label><select class="form-select" id="activity_type" name="activity_type">{% for type in activity_types %}<option value="{{ type.value }}">{{ type.value|replace('_',' ')|title }}</option>{% endfor %}</select></div><div class="col-md-4"><label class="form-label" for="tentmaster_id">Tentmaster</label><select class="form-select" id="tentmaster_id" name="tentmaster_id"><option value="">—</option>{% for team in tentmasters %}<option value="{{ team.id }}" {% if tentmaster_id == team.id %}selected{% endif %}>{{ team.name }}</option>{% endfor %}</select></div><div class="col-md-4"><label class="form-label" for="crew_member_id">Crew member</label><select class="form-select" id="crew_member_id" name="crew_member_id"><option value="">—</option>{% for person in crew_members %}<option value="{{ person.id }}">{{ person.name }}</option>{% endfor %}</select></div><div class="col-md-6"><label class="form-label" for="title">Title</label><input class="form-control" id="title" name="title" required></div><div class="col-md-3"><label class="form-label" for="start_at">Start</label><input class="form-control" type="datetime-local" id="start_at" name="start_at" value="{{ start or '' }}" required></div><div class="col-md-3"><label class="form-label" for="end_at">End</label><input class="form-control" type="datetime-local" id="end_at" name="end_at" value="{{ end or '' }}" required></div><div class="col-md-3"><label class="form-label" for="required_headcount">Required headcount</label><input class="form-control" type="number" min="0" id="required_headcount" name="required_headcount" value="0"></div><div class="col-md-9"><label class="form-label" for="notes">Notes</label><input class="form-control" id="notes" name="notes"></div></div><div class="mt-3"><button class="btn btn-primary" type="submit">Save activity</button></div></form>{% endblock %}
