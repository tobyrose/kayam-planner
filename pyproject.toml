[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "kayam-planner"
version = "0.1.0"
description = "Seasonal planning for Kayam tent-hire operations"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.16,<2",
    "fastapi>=0.116,<1",
    "jinja2>=3.1,<4",
    "openpyxl>=3.1,<4",
    "pydantic-settings>=2.10,<3",
    "python-dotenv>=1.1,<2",
    "python-multipart>=0.0.20,<1",
    "sqlalchemy>=2.0,<3",
    "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
    "httpx2>=2,<3",
    "mypy>=1.16,<2",
    "pytest>=8.4,<9",
    "ruff>=0.12,<1",
]

[project.scripts]
kayam-backup = "app.commands.backup:main"
kayam-export-json = "app.commands.export_json:main"
kayam-reseed-from-reference = "app.commands.reseed_from_reference:main"
kayam-seed = "app.commands.seed:main"
kayam-sync-equipment-taxonomy = "app.commands.sync_equipment_taxonomy:main"
kayam-workbook-diagnostic = "app.commands.workbook_diagnostic:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["static/**/*", "templates/**/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
packages = ["app"]
